name: CI

on:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[viz]"

      - name: Run metrics tests
        run: python3 tests/test_metrics.py

      - name: Run IO tests
        run: python3 tests/test_io.py

      - name: Run CLI tests
        run: python3 tests/test_cli.py

      - name: Run config tests
        run: python3 tests/test_config.py

      - name: Run self-tests
        run: python3 -m lhr_tools.cli selftest

      - name: Verify CLI entry point
        run: |
          lhr-tools --help >/dev/null
          lhr-tools config --show >/dev/null
          lhr-tools saturation --px 0.5 --fmax 0.9 >/dev/null
          echo "CLI entry point OK"
