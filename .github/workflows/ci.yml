name: CI

on:
  push:
    paths:
      - "tools/**"
      - "README.md"
      - "FAILURE_MODES.md"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "tools/**"
      - "README.md"
      - "FAILURE_MODES.md"
      - ".github/workflows/ci.yml"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: pip install -e ".[dev,viz]"

      - name: Pytest
        run: python -m pytest tests/ -q

      - name: Run self-tests
        run: python -m lhr_tools.cli selftest

      - name: Fixture CLI smoke
        run: |
          lhr-tools --help >/dev/null
          lhr-tools config --show >/dev/null
          lhr-tools saturation --px 0.3 --fmax 0.9 --eps 0.01 >/dev/null
          lhr-tools anchor tests/data/anchor.jsonl >/dev/null
          lhr-tools credit tests/data/credit.jsonl >/dev/null
          lhr-tools verifier tests/data/verifier.jsonl >/dev/null
          echo "fixture CLI OK"
